<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>휴대폰 특가 · 맞춤 상담 | 이지핫딜</title><meta name="description" content="휴대폰 특가와 구매 조건을 확인하고 원하는 기종과 통신사로 맞춤 상담을 신청하세요."><link rel="canonical" href="https://easyshoopping.com/phone.html"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/advertise.css"><link rel="stylesheet" href="/phone.css"><script src="/phone.js" defer></script></head><body><main class="advertise-page"><a class="advertise-brand" href="/">EASY HOT DEAL · 이지핫딜</a><header class="advertise-hero"><p class="advertise-eyebrow">PHONE DEALS</p><h1>내 휴대폰, 지금 바꾸면 얼마일까?</h1><p>구매 조건을 확인하고 내 상황에 맞는 상담을 받아보세요.<br>최종 가격과 재고는 상담에서 확인해드려요.</p></header><section aria-label="휴대폰 특가"><div id="phone-offers" class="phone-offers" aria-live="polite">특가를 불러오는 중이에요.</div></section><section class="advertise-card" id="consult"><h2>맞춤 상담 신청</h2><p>희망 기종과 현재 통신사를 알려주세요.</p><form id="phone-form"><div class="advertise-grid"><label class="wide">희망 기종<input name="model" maxlength="300" placeholder="예: 아이폰 17 256GB / 상담 후 결정" required></label><label>현재 통신사<select name="carrier" required><option value="">선택해 주세요</option><option>SKT</option><option>KT</option><option>LG U+</option><option>알뜰폰</option><option>모름</option></select></label><label>변경 방식<select name="changeType"><option>상담 후 결정</option><option>번호이동</option><option>기기변경</option></select></label><label class="wide">상담 방법<select name="method" id="phone-method"><option value="phone">전화 상담</option><option value="kakao" id="kakao-option" hidden disabled>카카오채널 1:1 상담</option></select></label><label id="phone-contact">휴대폰 번호<input name="phone" type="tel" autocomplete="tel" maxlength="30" placeholder="010-1234-5678" required></label><label id="phone-time">통화 가능한 시간<input name="preferredTime" maxlength="100" placeholder="예: 평일 오후 2~5시" required></label><label class="website-field" aria-hidden="true">웹사이트<input name="website" tabindex="-1" autocomplete="off"></label></div><label class="privacy-check"><input name="privacyConsent" type="checkbox" required><span>[필수] 이지핫딜의 상담 접수·연락을 위한 개인정보 수집·이용에 동의합니다. 수집 항목: 희망 기종, 통신사, 변경 방식, 상담 방법, 전화 상담 시 연락처·연락 가능 시간. 보유 기간: 접수일로부터 90일 후 삭제. 동의를 거부할 수 있으나 상담 접수가 제한됩니다.</span></label><button id="phone-submit">상담 신청하기</button></form><div id="phone-result" role="status" aria-live="polite"></div></section><p class="advertise-back"><a href="/">이지핫딜 홈으로</a></p></main></body></html>
